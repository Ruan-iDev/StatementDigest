# Optional: run both services with Docker
# Requires Docker Desktop. For simplest local use, prefer the PowerShell scripts.
services:
  backend:
    build: ./backend
    ports:
      - "8470:8470"
    environment:
      - LEDGERFLOW_DATA=/data
      - LEDGERFLOW_PORT=8470
    volumes:
      - ./data:/data
      - ./backend:/app
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8470 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3470:3470"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8470/api
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
